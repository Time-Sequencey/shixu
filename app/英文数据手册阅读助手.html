<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>数据手册双语对照</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#dce3df;color:#20312f;font:14px system-ui,"Microsoft YaHei",sans-serif}header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 16px;background:#fff;border-bottom:1px solid #bac9c2}h1{font-size:17px;margin:0 12px 0 0}button,input[type=file]::file-selector-button{font:inherit;border:1px solid #b7c9c1;border-radius:4px;background:#fff;padding:7px 10px;cursor:pointer;color:#163d36}button:hover,input[type=file]::file-selector-button:hover{background:#e8f4ef}button:disabled{opacity:.45}button.primary{background:#16745e;color:#fff;border-color:#16745e}input[type=file]{max-width:230px;font-size:12px;color:#526760}input[type=number]{width:60px;padding:7px;border:1px solid #b7c9c1;border-radius:4px}#status{font-size:12px;color:#526760;flex:1;min-width:180px}.controls{display:flex;align-items:center;gap:7px}.viewer{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px;height:calc(100vh - 62px)}.pane{min-width:0;overflow:auto;background:#cbd4d0}.pane-head{position:sticky;top:0;background:#f9fbfa;padding:8px 12px;font-weight:600;z-index:3;border-bottom:1px solid #ccd8d3}.page{position:relative;margin:14px auto 24px;background:#fff;box-shadow:0 2px 12px #223b332b}.page canvas{display:block;width:100%;height:100%}.cover{position:absolute;background:#fff;overflow:hidden;display:flex;align-items:center;line-height:1.08;white-space:normal;word-break:break-word;color:#111}.page .overlay{position:absolute;inset:0}.term-reveal{background:#d8eee4;color:#075a43;cursor:help}.viewer.dragging .pane{outline:3px dashed #16745e;outline-offset:-8px}@media(max-width:850px){.viewer{grid-template-columns:1fr;height:auto}.pane{height:75vh}}
</style><style>.mode{margin-left:auto;white-space:nowrap;display:flex;align-items:center;gap:5px;font-size:13px;color:#155947}.mode input{accent-color:#16745e}.selection-reveal{position:absolute;z-index:5;background:#fff;color:#111;white-space:normal;line-height:1.12;overflow:hidden;pointer-events:auto}.text-layer{position:absolute;inset:0;user-select:text}.text-layer span{position:absolute;color:transparent;user-select:text;white-space:nowrap;overflow:hidden;cursor:text}.term-reveal{background:transparent;color:#111}dialog{border:1px solid #b7c9c1;border-radius:6px;padding:20px;width:min(430px,92vw);box-shadow:0 12px 40px #17352b40}dialog::backdrop{background:#172c2880}dialog h2{font-size:16px;margin:0 0 12px}dialog input{width:100%;padding:9px;border:1px solid #b7c9c1;border-radius:4px}dialog p{font-size:12px;color:#53645e;line-height:1.5}.dialog-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}</style><style>.rebuilt-layer{position:absolute;inset:0}.rebuilt-paragraph{position:absolute;background:transparent;white-space:pre;font-family:"Microsoft YaHei",sans-serif;color:#111;user-select:text}.rebuilt-paragraph>div{white-space:pre}.selection-reveal{max-width:100%;line-height:1.35}#status{max-width:440px;line-height:1.4}</style></head><body>
<header><h1>数据手册双语对照</h1><input id="file" aria-label="选择本地 PDF" type="file" accept=".pdf,application/pdf"><div class="controls"><button id="prev" title="上一页">‹</button><input id="pageNo" aria-label="页码" type="number" min="1" value="1"><span id="pages">/ 0</span><button id="next" title="下一页">›</button></div><div class="controls"><button id="minus" title="缩小">−</button><span id="zoom">100%</span><button id="plus" title="放大">+</button></div><button class="primary" id="translate">翻译本页</button><button id="translateAll">一键翻译整份</button><button id="exportBoth" title="每页英文和中文并排">导出中英对照 PDF</button><button id="exportZh" title="仅导出中文页面">导出中文 PDF</button><span id="status">可选择或拖入 PDF。翻译需联网，页面文字可能发送到 Google 翻译或 MyMemory 备用服务。</span><label class="mode" title="开启即翻译本页，包含表头、引脚说明与参数表；保留数值、单位、图和公式"><input id="professional" type="checkbox">电子专业版</label><button id="deepseekButton" title="配置 DeepSeek API Key">DeepSeek API：未配置</button></header>
<dialog id="deepseekDialog"><h2>DeepSeek API</h2><p>配置后翻译优先使用 DeepSeek。密钥只存于本机服务内存，关闭服务后清除；PDF 文字会发送到 DeepSeek，可能产生 API 费用。</p><input id="deepseekKey" type="password" autocomplete="off" placeholder="sk-..." aria-label="DeepSeek API Key"><p id="deepseekMessage"></p><p id="deepseekBalance">配置后可查询账户余额。</p><p id="deepseekUsage">本次服务用量：0 tokens</p><div class="dialog-actions"><button id="deepseekRefresh">刷新余额</button><button id="deepseekClear">清除密钥</button><button id="deepseekCancel">取消</button><button id="deepseekSave" class="primary">使用此密钥</button></div></dialog>
<div class="viewer"><section class="pane" id="left"><div class="pane-head">English · 原文</div><div id="original" class="page"></div></section><section class="pane" id="right"><div class="pane-head">中文 · 对照译文</div><div id="translated" class="page"></div></section></div>
<script>
if (location.protocol === 'file:') {
  document.getElementById('status').textContent = '当前是直接打开 HTML，PDF 功能无法运行。请双击“启动文档助手.cmd”，再访问 http://127.0.0.1:8766/';
  document.getElementById('file').disabled = true;
} else {
  setTimeout(() => {
    if (!window.readerReady) document.getElementById('status').textContent = 'PDF 脚本未加载。请确认地址是 http://127.0.0.1:8766/，并刷新页面。';
  }, 4000);
}
</script>
<script src="/vendor/pdf-lib.min.js"></script>
<script type="module" src="/reader.mjs"></script></body></html>
